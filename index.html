<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wohin geht die Reise</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #eef2f7;
        padding: 20px;
        box-sizing: border-box;
      }
      .quiz-container {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 450px;
        width: 100%;
      }
      h1 {
        color: #2c3e50;
        font-size: 24px;
        margin-bottom: 20px;
      }
      p.intro-text {
        font-size: 16px;
        color: #34495e;
        line-height: 1.5;
        margin-bottom: 25px;
      }
      .btn-link {
        display: inline-block;
        background-color: #3498db;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 8px;
        width: 85%;
        font-weight: bold;
        transition: background 0.2s;
        box-sizing: border-box;
      }
      .btn-link:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="quiz-container">
      <h1>🗺️ Wohin geht die Reise?</h1>
      <p class="intro-text">
        Wir haben ein kleines Rätsel vorbereitet.<br /><br />
        <b>Bist du bereit?</b>
      </p>
      <!-- Link zur zweiten HTML-Datei -->
      <a href="quiz.html" class="btn-link">Ja, ich bin bereit! 🚀</a>
    </div>
  </body>
</html>
